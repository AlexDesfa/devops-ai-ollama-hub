name: Deployment Pipeline

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_api/requirements.txt

      - name: Run tests
        run: |
          python -m pytest

  deploy-dev:
    name: Deploy to Development
    needs: test
    if: github.ref == 'refs/heads/dev' || github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Create Ansible vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_password.txt

      - name: Run Ansible deployment
        run: |
          ansible-playbook -i ansible/inventory/dev ansible/site.yml \
            -e "target_env=dev git_branch=dev" \
            --vault-password-file vault_password.txt

      - name: Build and push Docker image
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker build -t $DOCKER_REGISTRY/rag-api:$IMAGE_TAG ./rag_api
          docker push $DOCKER_REGISTRY/rag-api:$IMAGE_TAG

      - name: Deploy to Dev Server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          ssh $DEV_HOST "docker pull $DOCKER_REGISTRY/rag-api:$IMAGE_TAG"
          ssh $DEV_HOST "docker-compose up -d"

      - name: Health Check
        run: |
          for i in {1..5}; do
            if curl -s https://dev.example.com/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  deploy-staging:
    name: Deploy to Staging
    needs: [test, deploy-dev]
    if: github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Create Ansible vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_password.txt

      - name: Run Ansible deployment
        run: |
          ansible-playbook -i ansible/inventory/staging ansible/site.yml \
            -e "target_env=staging git_branch=staging" \
            --vault-password-file vault_password.txt

      - name: Build and push Docker image
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          docker build -t $DOCKER_REGISTRY/rag-api:$IMAGE_TAG ./rag_api
          docker push $DOCKER_REGISTRY/rag-api:$IMAGE_TAG

      - name: Deploy to Staging Server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          ssh $STAGING_HOST "docker pull $DOCKER_REGISTRY/rag-api:$IMAGE_TAG"
          ssh $STAGING_HOST "docker-compose up -d"

      - name: Health Check
        run: |
          for i in {1..5}; do
            if curl -s https://staging.example.com/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  deploy-prod:
    name: Deploy to Production
    needs: [test, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Create Ansible vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_password.txt

      - name: Run Ansible deployment
        run: |
          ansible-playbook -i ansible/inventory/prod ansible/site.yml \
            -e "target_env=prod git_branch=main" \
            --vault-password-file vault_password.txt

      - name: Create deployment tag
        run: |
          git tag "release-$(date +%Y%m%d-%H%M%S)"
          git push --tags

      - name: Build and push Docker image
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $DOCKER_REGISTRY/rag-api:$IMAGE_TAG ./rag_api
          docker push $DOCKER_REGISTRY/rag-api:$IMAGE_TAG

      - name: Deploy to Production Server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          ssh $PROD_HOST "docker pull $DOCKER_REGISTRY/rag-api:$IMAGE_TAG"
          ssh $PROD_HOST "docker-compose up -d"

      - name: Health Check
        run: |
          for i in {1..5}; do
            if curl -s https://example.com/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify Deployment
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: 'Production deployment ${{ job.status }}'

  rollback:
    name: Rollback Deployment
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "::set-output name=environment::prod"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "::set-output name=environment::staging"
          else
            echo "::set-output name=environment::dev"
          fi

      - name: Rollback Deployment
        env:
          HOST: ${{ secrets[format('{0}_HOST', steps.env.outputs.environment)] }}
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', steps.env.outputs.environment)] }}
        run: |
          echo "$SSH_KEY" > ssh_key
          chmod 600 ssh_key
          ssh -i ssh_key $HOST "docker-compose stop && docker-compose up -d --no-deps previous_version"

      - name: Notify Rollback
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: warning
          SLACK_MESSAGE: 'Rollback initiated for ${{ steps.env.outputs.environment }} environment'
