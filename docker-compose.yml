services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.localhost`)"
      - "traefik.http.routers.ollama.entrypoints=web"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.6.22
    container_name: openwebui
    restart: unless-stopped
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`webui.localhost`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.localhost`)"
      - "traefik.http.routers.qdrant.entrypoints=web"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  rag_api:
    build:
      context: ./rag_api
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ragapi.rule=Host(`ragapi.localhost`)"
      - "traefik.http.routers.ragapi.entrypoints=web"
      - "traefik.http.services.ragapi.loadbalancer.server.port=8000"

volumes:
  ollama_data:
  openwebui_data:
  qdrant_data:

networks:
  internal:
    driver: bridge
