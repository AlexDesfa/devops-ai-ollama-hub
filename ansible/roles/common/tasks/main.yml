---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
      - git
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu

- name: Install required Python packages
  pip:
    name:
      - docker
      - docker-compose
    state: present

- name: Set up timezone
  timezone:
    name: UTC

- name: Configure system limits for Docker
  pam_limits:
    domain: '*'
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  loop:
    - { limit_type: soft, limit_item: nofile, value: 1048576 }
    - { limit_type: hard, limit_item: nofile, value: 1048576 }
    - { limit_type: soft, limit_item: nproc, value: unlimited }
    - { limit_type: hard, limit_item: nproc, value: unlimited }

- name: Set sysctl parameters
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'vm.max_map_count', value: '262144' }
    - { name: 'net.core.somaxconn', value: '65535' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
